name: skillforge_student
description: "SkillForge - Student Learning App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.2.1
  dio: ^5.4.3+1

  # State Management
  provider: ^6.1.2

  # Secure Storage (JWT tokens)
  flutter_secure_storage: ^9.0.0

  # Navigation
  go_router: ^14.2.7

  # Video Player
  video_player: ^2.8.6
  chewie: ^1.8.1

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.6
  image_picker: ^1.1.2
  path_provider: ^2.1.3
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
