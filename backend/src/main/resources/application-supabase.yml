spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${SUPABASE_DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
